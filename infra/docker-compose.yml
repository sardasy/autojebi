# M4 풀스택: Postgres + Qdrant + autojebi API.
# milim-hwp-agent는 사용자 Windows 데스크톱이므로 컨테이너화 안 함.
#
# 사용:
#   cp .env.example .env  # ANTHROPIC_API_KEY 등 채움
#   docker compose -f infra/docker-compose.yml up -d
#   curl http://localhost:8001/healthz
#   # → {"ok": true, "checks": {"db": "ok"}}
#
# 종료:
#   docker compose -f infra/docker-compose.yml down

services:
  db:
    image: postgres:16-alpine
    container_name: autojebi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autojebi
      POSTGRES_PASSWORD: autojebi
      POSTGRES_DB: autojebi
    ports:
      - "5433:5432"      # 사용자 환경의 로컬 5432와 충돌 방지
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autojebi -d autojebi"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: autojebi-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"      # REST + Web UI
      - "6334:6334"      # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: autojebi-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://autojebi:autojebi@db:5432/autojebi
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-abb_skus}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
      BID_KEYWORDS: ${BID_KEYWORDS:-ABB,차단기,변압기,인버터,전력변환,UPS,배전반,IGBT,모터드라이브}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      HWP_AGENT_BASE_URL: ${HWP_AGENT_BASE_URL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      COLLECT_HOUR: ${COLLECT_HOUR:-8}
      COLLECT_MINUTE: ${COLLECT_MINUTE:-0}
      LLM_ATTACHMENT_FETCH: ${LLM_ATTACHMENT_FETCH:-true}
      GRADE_ALERT_THRESHOLD: ${GRADE_ALERT_THRESHOLD:-0.6}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # M11 v2 — 서류 자동화 업로드/내보내기 저장소
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-30000000}
      UPLOAD_ALLOWED_EXTS: ${UPLOAD_ALLOWED_EXTS:-pdf,hwp,hwpx,jpg,jpeg,png,xlsx,docx}
    ports:
      - "8001:8000"
    volumes:
      # M11 v2 — 호스트 ./data/uploads, ./data/exports에 영속화
      - ../data/uploads:/app/uploads
      - ../data/exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # M7 — Next.js 15 minimal 읽기전용 프론트
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001}
    container_name: autojebi-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001}
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:-http://api:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-${API_KEY:-}}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  e2e:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.e2e
    container_name: autojebi-e2e
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_BASE: http://api:8000
      E2E_API_KEY: ${API_KEY:-}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_storage:
