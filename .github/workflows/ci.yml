name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: import boundaries (ADR 0001)
        run: lint-imports

      - name: pytest
        run: python -m pytest -q

      - name: immutable document rule versions
        run: python tools/check_document_rule_manifest.py
        env:
          DOCUMENT_RULE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  frontend:
    name: frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: lint (includes ADR 0001 fetch rule)
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8001
