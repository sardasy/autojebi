<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoJebi{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/ui/dashboard">AutoJebi</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="/ui/dashboard">대시보드</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='bids' %}active{% endif %}" href="/ui/bids">공고</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='rules' %}active{% endif %}" href="/ui/rules">알림 룰</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='awards' %}active{% endif %}" href="/ui/awards">낙찰</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    integrity="sha384-CqGFFG5cHbU8ETnDCxNHGNL/lwGGZbZ7m6q4qXR+nF4Wm0BC2y6OMyZilZcUVfNF"
    crossorigin="anonymous"></script>
  <script
    src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"
    integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq"
    crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
