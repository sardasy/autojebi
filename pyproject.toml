[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[project]
name = "autojebi"
version = "0.1.0"
description = "Milim bid automation (phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "tenacity>=8.3",
  "apscheduler>=3.10",
  "anthropic>=0.40",
  "pdfplumber>=0.11",
  "qdrant-client[fastembed]>=1.9",
  "alembic>=1.13",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: 줄 길이는 black이 다룬다.
# B008: FastAPI는 Body(...)/File(...)/Depends(...)를 default arg로 쓰는 게 표준 패턴.
# B904: 기존 endpoint들이 HTTPException(...)을 from 절 없이 던지는 패턴을 일관되게 유지.
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
